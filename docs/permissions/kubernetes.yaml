# An administrator grants this role to an existing authenticated audit group.
# Replace orphanscan-auditors with the group used by your identity provider.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: orphanscan-reader
rules:
  - apiGroups: [""]
    resources: [pods, persistentvolumeclaims]
    verbs: [list]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: orphanscan-reader
subjects:
  - kind: Group
    name: orphanscan-auditors
    apiGroup: rbac.authorization.k8s.io
roleRef:
  kind: ClusterRole
  name: orphanscan-reader
  apiGroup: rbac.authorization.k8s.io

name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  test:
    uses: ./.github/workflows/test.yml
  lint:
    uses: ./.github/workflows/lint.yml
  goreleaser:
    needs: [test, lint]
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Check release configuration
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: v2.19.0
          args: check

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: v2.19.0
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # These are intentionally vars (not secrets). The phc_ project token is
          # public by design and safe to expose in logs. Never store a personal
          # (phx_) or secret (phs_) API key here.
          ORPHANSCAN_POSTHOG_HOST: ${{ vars.ORPHANSCAN_POSTHOG_HOST }}
          ORPHANSCAN_POSTHOG_PROJECT_TOKEN: ${{ vars.ORPHANSCAN_POSTHOG_PROJECT_TOKEN }}
